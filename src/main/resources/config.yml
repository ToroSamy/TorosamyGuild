prefix-max-length: 5
prefix-min-length: 2

#单位分钟
delete-guild-cooldown: 21600

#玩家在线多少小时才能创建公会
create-time-condition: 72

#一页展示多少个公会
max-page-show: 5

#展示公会时 多久才排一次序 单位s
sort-rank-cooldown: 600
#公会圈地价格
res-cost-block: 0.01

# 若不开启 只会在stop服务器时保存
# 定时保存 防止多次读写文件
auto-save:
  enabled: true
  # 多久保存一次
  minutes: 30

# 基本信息展示的材质
gui-basic-info-item: NETHER_STAR
# 领地传送的材质
#gui-visit-item: BEACON
# 成员捐赠的材质
member-donation-item: BEACON

no-guild-holder: "暂无公会"

default-guild-config:
  score: 0.0
  color: DARK_GRAY
database:
  enabled: false
  host: "localhost"
  port: "3306"
  database: "torosamy_guild"
  username: "root"
  password: "root"